# One-off Prisma migration Job.
#
# The gateway Deployment runs with RUN_MIGRATIONS_ON_START=false, so the
# database schema must be applied explicitly before (and after every upgrade
# that ships new migrations). The image *can* migrate on boot, but keeping it
# out of the gateway container stops every replica racing the same schema
# change during a rollout:
#
#   kubectl apply -f migrations-job.yaml
#   kubectl -n x402 wait --for=condition=complete job/prisma-migrate
#   kubectl -n x402 logs job/prisma-migrate
#
# The Job reuses the gateway image (which bundles @prisma/client + the Prisma
# CLI via the workspace) and points at the same DATABASE_URL from the secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: x402
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: x402
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      # The label is what the Postgres NetworkPolicy allows through.
      labels:
        app.kubernetes.io/name: prisma-migrate
        app.kubernetes.io/part-of: x402
    spec:
      restartPolicy: OnFailure
      serviceAccountName: x402-gateway
      automountServiceAccountToken: false
      containers:
        - name: prisma-migrate
          image: x402/gateway:latest
          imagePullPolicy: Always
          # The Prisma CLI lives in the workspace package's OWN .bin
          # (pnpm's isolated layout puts binaries in the package, not the root
          # node_modules), so run from the package directory. Without this,
          # `npx --no-install prisma` finds no local CLI and tries to download
          # a different Prisma from the network — which fails in a cluster with
          # no egress and would apply the wrong schema version.
          workingDir: /app/packages/database
          command:
            [
              'npx',
              '--no-install',
              'prisma',
              'migrate',
              'deploy',
              '--schema',
              'prisma/schema.prisma',
            ]
          envFrom:
            - secretRef:
                name: x402-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
