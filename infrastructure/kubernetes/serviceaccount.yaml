# Dedicated, least-privilege ServiceAccounts.
#
# Each workload runs with `automountServiceAccountToken: false`, so no pod ever
# receives an API token; the dedicated accounts exist so the pods are kept off
# the namespace `default` ServiceAccount (whose bindings can be wider than
# expected, and which is shared by anything in the namespace that forgets to
# set one).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: x402-gateway
  namespace: x402
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: x402
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: x402-dashboard
  namespace: x402
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: x402
automountServiceAccountToken: false
