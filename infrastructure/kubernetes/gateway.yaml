apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: x402
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: x402
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Gateway Deployment.
#
# Image: published by .github/workflows/deploy.yml on version tags as
# x402/gateway:latest and x402/gateway:<version>. Pin a specific version tag
# in production instead of `latest`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: x402
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: x402
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # Readiness-gated rollout: with maxUnavailable: 0 a new pod must become Ready
  # (readinessProbe: /health/ready) before the old one is removed, and
  # minReadySeconds adds a short soak so a flapping pod can't be declared
  # available. progressDeadlineSeconds fails a rollout that can't finish —
  # startup can legitimately take ~5 min while migrations/warm-up complete.
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: x402
    spec:
      # Dedicated ServiceAccount; no Kubernetes API access is needed.
      serviceAccountName: x402-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: x402/gateway:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: x402-config
            - secretRef:
                name: x402-secrets
          # NOTE: the gateway image does NOT run Prisma migrations on boot
          # (CMD is `node dist/apps/gateway/main.js`). Apply the schema once
          # before scaling the Deployment:
          #   kubectl apply -f migrations-job.yaml   # runs `prisma migrate deploy`
          # Re-run the Job after every upgrade that ships a new migration.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          # Readiness must hit /health/ready — that is the only endpoint that
          # actually probes Postgres + Redis. /health is a static liveness
          # answer, so using it here would keep a pod with a dead database or
          # Redis "Ready" and route paid traffic into failing requests.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          # Liveness deliberately stays on /health: it must NOT fail when a
          # dependency is down, or Kubernetes would restart-loop the pod
          # through a transient database/Redis outage instead of draining it.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60 # allow up to ~5 min for migrations on first boot
