services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: x402_gateway
      POSTGRES_USER: x402
      POSTGRES_PASSWORD: x402_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U x402 -d x402_gateway']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Containerized app (opt-in) ───────────────────────────────
  #
  # `gateway` and `dashboard` sit behind the `stack` profile, so a plain
  # `docker compose up` starts ONLY postgres + redis. That is what keeps the
  # two dev flows from fighting:
  #
  #   from source  `pnpm infra:up` + `pnpm dev:gateway` / `pnpm dev:dashboard`
  #                → owns 3000 / 3001
  #   containers   `pnpm docker:up`  (`--profile stack`)
  #                → starts the app only when explicitly asked for
  #
  # The published host ports are overridable, so both flows can run side by
  # side instead of one failing on "port is already allocated":
  #   GATEWAY_HOST_PORT=3100 DASHBOARD_HOST_PORT=3101 pnpm docker:up
  gateway:
    profiles: ['stack']
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.gateway
    ports:
      - '${GATEWAY_HOST_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: '0.0.0.0'
      DATABASE_URL: postgresql://x402:x402_dev_password@postgres:5432/x402_gateway
      REDIS_URL: redis://redis:6379
      STELLAR_NETWORK: testnet
      HORIZON_URL: https://horizon-testnet.stellar.org
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
      # Fail fast: docker compose refuses to start without a real JWT_SECRET
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in .env (openssl rand -base64 32)}
      # Both origins are allowed by default: the local dashboard container and
      # the deployed Vercel dashboard (which calls this gateway from the
      # browser, so its origin must be allow-listed or every request fails
      # CORS). The first origin tracks DASHBOARD_HOST_PORT so allow-listing
      # keeps working when the dashboard is moved off 3001 to run alongside the
      # from-source flow.
      #
      # Deliberately NOT the shared `CORS_ORIGINS`: that value lives in the root
      # .env, is meant for the from-source gateway (which serves the dashboard
      # on 3001), and would otherwise win here and silently pin the
      # containerized allow-list to 3001. Set STACK_CORS_ORIGINS to replace it.
      CORS_ORIGINS: ${STACK_CORS_ORIGINS:-http://localhost:${DASHBOARD_HOST_PORT:-3001},https://pay-per-token-llm-gateway-dashboard.vercel.app}
      # Applied by the image entrypoint before the gateway starts, so a fresh
      # `docker compose up` never boots against an empty schema. Idempotent.
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      # Public base URL the gateway puts in 402 quotes (statusUrl +
      # instructions). Without it the gateway falls back to
      # `http://0.0.0.0:3000`, which no client can reach — so paying clients
      # get a status URL they cannot poll. Derived from
      # NEXT_PUBLIC_GATEWAY_URL because it IS the same URL (the dashboard is
      # built with that value and calls it directly), which keeps the two from
      # drifting. Override PUBLIC_GATEWAY_URL only if they genuinely differ.
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:${GATEWAY_HOST_PORT:-3000}}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    profiles: ['stack']
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.dashboard
      args:
        # Inlined into the client bundle at BUILD time (Next.js NEXT_PUBLIC_*).
        # The browser reaches the gateway on the host's published port, so this
        # must be a URL the browser can resolve — not the in-cluster `gateway`
        # DNS name, which a browser cannot see. Tracks GATEWAY_HOST_PORT so the
        # bundle keeps pointing at the port the gateway actually publishes.
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:${GATEWAY_HOST_PORT:-3000}}
    ports:
      - '${DASHBOARD_HOST_PORT:-3001}:3001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    environment:
      NODE_ENV: production
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
