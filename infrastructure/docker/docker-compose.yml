services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: x402_gateway
      POSTGRES_USER: x402
      POSTGRES_PASSWORD: x402_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U x402 -d x402_gateway']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.gateway
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: '0.0.0.0'
      DATABASE_URL: postgresql://x402:x402_dev_password@postgres:5432/x402_gateway
      REDIS_URL: redis://redis:6379
      STELLAR_NETWORK: testnet
      HORIZON_URL: https://horizon-testnet.stellar.org
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
      # Fail fast: docker compose refuses to start without a real JWT_SECRET
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in .env (openssl rand -base64 32)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,https://x402-dashboard.vercel.app}
      # Applied by the image entrypoint before the gateway starts, so a fresh
      # `docker compose up` never boots against an empty schema. Idempotent.
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      # Public base URL the gateway puts in 402 quotes (statusUrl +
      # instructions). Without it the gateway falls back to
      # `http://0.0.0.0:3000`, which no client can reach — so paying clients
      # get a status URL they cannot poll. Derived from
      # NEXT_PUBLIC_GATEWAY_URL because it IS the same URL (the dashboard is
      # built with that value and calls it directly), which keeps the two from
      # drifting. Override PUBLIC_GATEWAY_URL only if they genuinely differ.
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:3000}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.dashboard
      args:
        # Inlined into the client bundle at BUILD time (Next.js NEXT_PUBLIC_*).
        # The browser reaches the gateway on the host's published port, so this
        # must be a URL the browser can resolve — not the in-cluster `gateway`
        # DNS name, which a browser cannot see.
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:3000}
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    environment:
      NODE_ENV: production
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
