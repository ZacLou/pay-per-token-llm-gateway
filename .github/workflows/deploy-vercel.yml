name: Deploy Dashboard to Vercel

on:
  push:
    branches: [main]
    # Monorepo: only redeploy when dashboard-relevant files change.
    # Remove the `paths` filter to deploy on every push to main.
    paths:
      - 'apps/dashboard/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

# If a new commit lands on main while a deploy is running, cancel the stale
# deploy — only the latest main should go to production.
concurrency:
  group: vercel-dashboard-production
  cancel-in-progress: true

env:
  PNPM_VERSION: '11.24.0'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy dashboard to Vercel (production)
    runs-on: ubuntu-latest
    # `secrets` is not available in step-level `if:` expressions, so bridge the
    # presence check through job env — the same pattern deploy.yml uses for
    # HAS_STELLAR_SECRET.
    #
    # A missing credential FAILS this job. It used to skip with a warning and
    # still report success, which is worse than failing: this workflow exists to
    # put the dashboard into production, so a green run that deployed nothing is
    # a false signal. That is exactly how a stale production bundle — one still
    # calling http://localhost:3000 — stayed live through nine consecutive
    # "successful" runs, each of which finished in 5-11s having built nothing.
    #
    # For a fork, or before the project is wired up to Vercel at all, set the
    # repository variable ALLOW_DEPLOY_SKIP=true to opt back into skipping. The
    # opt-out is explicit, per-repository and logged in the run summary, so it
    # can never be mistaken for a deploy.
    env:
      HAS_VERCEL_SECRET: ${{ secrets.VERCEL_TOKEN != '' }}
      ALLOW_DEPLOY_SKIP: ${{ vars.ALLOW_DEPLOY_SKIP == 'true' }}
    steps:
      - name: Vercel credentials not configured
        if: env.HAS_VERCEL_SECRET != 'true'
        run: |
          if [ "${ALLOW_DEPLOY_SKIP}" = 'true' ]; then
            STATUS='skipped (ALLOW_DEPLOY_SKIP=true)'
          else
            STATUS='FAILED — credentials missing'
          fi

          {
            echo "### Dashboard deploy ${STATUS}"
            echo ""
            echo "\`VERCEL_TOKEN\` is not set, so this workflow could not deploy the"
            echo "dashboard to production. The live dashboard is whatever was last"
            echo "deployed by hand or by Vercel's own Git integration — not this commit."
            echo ""
            echo "Add these repository secrets under *Settings → Secrets and variables → Actions*:"
            echo ""
            echo "| Secret | Where to find it |"
            echo "| --- | --- |"
            echo "| \`VERCEL_TOKEN\` | vercel.com/account/tokens |"
            echo "| \`VERCEL_ORG_ID\` | Vercel project → Settings → General → Team ID |"
            echo "| \`VERCEL_PROJECT_ID\` | Vercel project → Settings → General → Project ID |"
            echo ""
            echo "Then, in the Vercel project: set \`NEXT_PUBLIC_GATEWAY_URL\` to the public"
            echo "gateway URL (inlined into the client bundle at build time, so it needs a"
            echo "rebuild), and make sure that gateway's \`CORS_ORIGINS\` lists this"
            echo "dashboard's origin."
            echo ""
          echo "If the project's Git integration is healthy, Vercel deploys on push"
          echo "without this workflow at all. If pushes produce no deployment, that"
          echo "integration is what is broken — see DEPLOYMENT.md §2.5 for the"
          echo "\`git_info_fail\` / \`repo_not_found\` signature and the fix."
          echo ""
          echo "To deliberately skip instead of failing, set the repository variable"
          echo "\`ALLOW_DEPLOY_SKIP\` to \`true\`."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${ALLOW_DEPLOY_SKIP}" = 'true' ]; then
            echo "::warning title=Dashboard deploy skipped::VERCEL_TOKEN is not set and ALLOW_DEPLOY_SKIP=true."
            exit 0
          fi

          echo "::error title=Dashboard deploy cannot run::VERCEL_TOKEN is not set — the dashboard was NOT deployed. See the job summary, or set ALLOW_DEPLOY_SKIP=true to skip deliberately."
          exit 1

      - uses: actions/checkout@v4
        if: env.HAS_VERCEL_SECRET == 'true'

      - name: Read Node version from .nvmrc
        if: env.HAS_VERCEL_SECRET == 'true'
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        if: env.HAS_VERCEL_SECRET == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        if: env.HAS_VERCEL_SECRET == 'true'
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}

      # The deploy runs the Vercel CLI at the REPOSITORY ROOT — not in
      # apps/dashboard, and not via `nx build dashboard`.
      #
      # Root, because the project's Root Directory is `apps/dashboard` and
      # Vercel applies that setting server-side while building. Uploading the
      # repo root is what keeps the pnpm workspace intact for the build command
      # in apps/dashboard/vercel.json (`pnpm install --frozen-lockfile`, then
      # `pnpm exec next build`), which needs the root pnpm-lock.yaml and
      # pnpm-workspace.yaml. Deploying from apps/dashboard uploads that
      # directory alone, with no lockfile above it. Measured, not assumed: a
      # `vercel deploy` from the repo root with the project's own token builds
      # and deploys this dashboard correctly, and the resulting deployment
      # belongs to this project.
      #
      # Not nx, because the @nx/next:build executor fails with
      # "ENOENT: scandir 'apps/dashboard/public'" when invoked from a
      # subdirectory with a cold cache; plain `next build` resolves the app
      # directory from its own cwd and works.
      #
      # `--yes` so a first run can never stall on an interactive prompt.
      #
      # One-time Vercel project setup:
      #   1. Import the repo and set the project Root Directory to `apps/dashboard`.
      #   2. Add secrets to this repo:
      #        VERCEL_TOKEN       → vercel.com/account/tokens
      #        VERCEL_ORG_ID      → Vercel project → Settings → General → Team ID
      #        VERCEL_PROJECT_ID  → Vercel project → Settings → General → Project ID
      #   3. Set NEXT_PUBLIC_GATEWAY_URL in the Vercel project env to the PUBLIC
      #      gateway URL. The dashboard calls the gateway directly from the
      #      browser, and NEXT_PUBLIC_* values are inlined into the client
      #      bundle at BUILD time — so a change requires a rebuild, and the URL
      #      must be reachable from the public internet. The gateway's
      #      CORS_ORIGINS must also include this dashboard's origin.
      #      Verify locally with `bash scripts/vercel-deploy-check.sh`, which
      #      asserts the value actually landed in the built client assets.
      - name: Deploy to Vercel
        if: env.HAS_VERCEL_SECRET == 'true'
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod --yes

      # A successful upload is not a working dashboard. The dashboard once sat
      # in production with http://localhost:3000 baked into its client bundle:
      # every page failed in the visitor's browser (ERR_CONNECTION_REFUSED)
      # while every deploy reported success, because a bundle aimed at the
      # visitor's own machine looks exactly like a healthy build until it is
      # loaded. So the deploy is not done until the LIVE deployment is checked.
      #
      # Retried because the production alias can lag the successful upload by a
      # few seconds; the check exits non-zero on every other failure anyway.
      - name: Smoke-check the deployed dashboard
        if: env.HAS_VERCEL_SECRET == 'true'
        env:
          EVIDENCE_ALWAYS: '1'
        run: |
          for attempt in 1 2 3; do
            if bash scripts/production-smoke.sh; then exit 0; fi
            echo "::warning title=Production smoke check failed::attempt ${attempt}/3 — production may not have switched over yet"
            sleep 15
          done
          echo "::error title=Production smoke check failed::the live dashboard is not pointed at a live gateway after 3 attempts"
          exit 1

      - name: Attach the smoke report to the run summary
        if: always() && env.HAS_VERCEL_SECRET == 'true'
        run: |
          if [ -f docs/evidence/production-smoke.json ]; then
            {
              echo "### Production smoke check"
              echo ""
              echo '```json'
              cat docs/evidence/production-smoke.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
