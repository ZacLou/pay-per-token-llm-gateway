name: Deploy Dashboard to Vercel

on:
  push:
    branches: [main]
    # Monorepo: only redeploy when dashboard-relevant files change.
    # Remove the `paths` filter to deploy on every push to main.
    paths:
      - 'apps/dashboard/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

# If a new commit lands on main while a deploy is running, cancel the stale
# deploy — only the latest main should go to production.
concurrency:
  group: vercel-dashboard-production
  cancel-in-progress: true

env:
  PNPM_VERSION: '11.24.0'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy dashboard to Vercel (production)
    runs-on: ubuntu-latest
    # `secrets` is not available in step-level `if:` expressions, so bridge the
    # presence check through job env — the same pattern deploy.yml uses for
    # HAS_STELLAR_SECRET. Without it, a repo that has not been wired up to
    # Vercel yet fails every push to main with the opaque action error
    # "Input required and not supplied: vercel-token". A missing credential is
    # a configuration gap, so it skips (with instructions) rather than fails.
    env:
      HAS_VERCEL_SECRET: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: Vercel credentials not configured — skipping deploy
        if: env.HAS_VERCEL_SECRET != 'true'
        run: |
          {
            echo "### Dashboard deploy skipped"
            echo ""
            echo "\`VERCEL_TOKEN\` is not set, so the Vercel deploy step was skipped."
            echo "This is a configuration gap, not a build failure."
            echo ""
            echo "To enable production dashboard deploys, add these repository secrets"
            echo "under *Settings → Secrets and variables → Actions*:"
            echo ""
            echo "| Secret | Where to find it |"
            echo "| --- | --- |"
            echo "| \`VERCEL_TOKEN\` | vercel.com/account/tokens |"
            echo "| \`VERCEL_ORG_ID\` | Vercel project → Settings → General → Team ID |"
            echo "| \`VERCEL_PROJECT_ID\` | Vercel project → Settings → General → Project ID |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Dashboard deploy skipped::VERCEL_TOKEN is not set — see the job summary for setup instructions."

      - uses: actions/checkout@v4
        if: env.HAS_VERCEL_SECRET == 'true'

      - name: Read Node version from .nvmrc
        if: env.HAS_VERCEL_SECRET == 'true'
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        if: env.HAS_VERCEL_SECRET == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        if: env.HAS_VERCEL_SECRET == 'true'
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}

      # The build runs on Vercel's infrastructure using the build command in
      # apps/dashboard/vercel.json (pnpm install + next build). Note: do NOT
      # use `nx build dashboard` here — Vercel's Root Directory is
      # apps/dashboard, and the Nx @nx/next:build executor fails with
      # "ENOENT: scandir 'apps/dashboard/public'" when invoked from a
      # subdirectory with a cold cache. Plain `next build` resolves the app
      # dir from its own cwd and works. So no local install is needed here.
      #
      # One-time Vercel project setup:
      #   1. Import the repo and set the project Root Directory to `apps/dashboard`.
      #   2. Add secrets to this repo:
      #        VERCEL_TOKEN       → vercel.com/account/tokens
      #        VERCEL_ORG_ID      → Vercel project → Settings → General → Team ID
      #        VERCEL_PROJECT_ID  → Vercel project → Settings → General → Project ID
      #   3. Set NEXT_PUBLIC_GATEWAY_URL in the Vercel project env (or replace the
      #      placeholder in apps/dashboard/vercel.json) so the /api/gateway/*
      #      rewrites point at the real Railway gateway URL.
      - name: Deploy to Vercel
        if: env.HAS_VERCEL_SECRET == 'true'
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/dashboard
          vercel-args: --prod
